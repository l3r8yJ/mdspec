name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verified-ci:
    name: Validate tag and reuse CI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install just
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        with:
          tool: just@1.58.0
      - name: Match tag to package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: just verify-tag
      - name: Require the tag to only bump the version
        run: |
          changed=$(git diff --name-only HEAD^ HEAD | sort | paste -sd ' ')
          if [[ "$changed" != 'Cargo.lock Cargo.toml' ]]; then
            echo "The release commit must change only Cargo.toml and Cargo.lock, got: $changed" >&2
            exit 1
          fi
      - name: Find and await CI for the released main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          commit_sha=$(git rev-parse HEAD^)
          run_id=$(gh run list --workflow ci.yml --commit "$commit_sha" --branch main --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo 'No main-branch push CI run exists for this commit. Merge it and run CI before tagging.' >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 10

  publish:
    name: Publish release build
    needs: verified-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install just
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        with:
          tool: just@1.58.0
      - name: Build, smoke test, package
        run: just package
      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
          fi
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --prerelease="$prerelease"
