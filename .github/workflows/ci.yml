name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install just
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        with:
          tool: just@1.58.0
      - name: Check formatting
        run: just fmt-check

  clippy:
    name: Strict Clippy
    needs: format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install just
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        with:
          tool: just@1.58.0
      - name: Check all targets and features
        run: just clippy

  test:
    name: Tests and coverage
    needs: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and LLVM tools
        run: rustup component add llvm-tools-preview
      - name: Install just and coverage tool
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        with:
          tool: just@1.58.0,cargo-llvm-cov@0.9.1
      - name: Run tests once with coverage instrumentation
        run: just test-coverage
      - name: Enforce 70 percent line coverage
        run: just coverage-check
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage
          path: target/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  build:
    name: Release build
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install just
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        with:
          tool: just@1.58.0
      - name: Build, smoke test, and package
        run: just package
      - name: Verify crates.io source package without publishing
        run: just publish-check
      - name: Upload verified release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mdspec-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 90
