[package]
name = "mdspec"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Validate structured Markdown endpoint documentation"
license = "MIT"
repository = "https://github.com/l3r8yJ/mdspec"
readme = "README.md"
keywords = ["markdown", "validation", "documentation", "cli", "api"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/.cargo/mutants.toml",
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/mdspec.toml",
    "/clippy.toml",
    "/rust-toolchain.toml",
    "/justfile",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }
ignore = "0.4"
globset = "0.4"

[dev-dependencies]
asserting = { version = "0.17", default-features = false, features = ["std"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
struct_excessive_bools = "allow"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
cognitive_complexity = "warn"
