docker:
  image: rust:1.96.0-bookworm
  as_root: true

assets:
  credentials: l3r8yJ/home#assets/crates-credentials
  push-token: l3r8yJ/home#assets/mdspec/push-token

install: |
  set -euo pipefail
  apt-get update
  apt-get install -y --no-install-recommends jq
  just_version=1.58.0
  just_archive="just-${just_version}-x86_64-unknown-linux-musl.tar.gz"
  curl --fail --silent --show-error --location --retry 2 --output "/tmp/${just_archive}" "https://github.com/casey/just/releases/download/${just_version}/${just_archive}"
  echo "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d  /tmp/${just_archive}" | sha256sum --check --strict || { echo "just ${just_version} archive checksum mismatch" >&2; exit 1; }
  tar --extract --file "/tmp/${just_archive}" --directory /usr/local/bin just
  just --version

release:
  script: |
    set -euo pipefail
    export RELEASE_TAG="${tag}"
    base_sha=$(git rev-parse HEAD)
    ci_run=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --get --data-urlencode "head_sha=$base_sha" --data-urlencode branch=main --data-urlencode event=push --data-urlencode per_page=1 https://api.github.com/repos/l3r8yJ/mdspec/actions/workflows/ci.yml/runs)
    jq --exit-status --arg sha "$base_sha" '.workflow_runs[0] | .head_sha == $sha and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success"' <<< "$ci_run" > /dev/null || { echo 'Release requires successful main push CI for this exact commit.' >&2; exit 1; }
    just release-bump
    release_sha=$(git rev-parse HEAD)
    if [[ "$release_sha" != "$base_sha" ]]; then
      test -s ../push-token || { echo 'The push-token asset is missing or empty: l3r8yJ/home#assets/mdspec/push-token.' >&2; exit 1; }
      credential_file=$(mktemp)
      trap 'rm -f -- "${credential_file:-}"' EXIT
      chmod 600 "$credential_file"
      printf 'https://x-access-token:%s@github.com\n' "$(cat ../push-token)" > "$credential_file"
      GIT_TERMINAL_PROMPT=0 git -c credential.helper="store --file=${credential_file}" push https://github.com/l3r8yJ/mdspec.git HEAD:main
    fi
    just verify-tag
    cargo_directory="${CARGO_HOME:-$HOME/.cargo}"
    credential_path="$cargo_directory/credentials.toml"
    [[ ! -e "$credential_path" && ! -e "$cargo_directory/credentials" ]] || { echo 'Refusing to overwrite existing Cargo credentials.' >&2; exit 1; }
    test -s ../credentials
    mkdir -p "$cargo_directory"
    trap 'rm -f -- "${credential_file:-}" "$credential_path"' EXIT
    install -m 600 ../credentials "$credential_path"
    just publish
